[package]
name = "picview"
version = "0.1.0"
license = "MIT"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "ico", "rayon"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
rayon = "1"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"

# decode images fast even in debug builds
[profile.dev.package."*"]
opt-level = 3
