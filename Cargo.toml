[package]
name = "oddity-picview"
version = "0.0.16"
license = "MIT"
edition = "2021"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
ruzstd = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff", "ico", "rayon"] }
jpeg-decoder = "0.3"
kamadak-exif = "0.6"
rayon = "1"
trash = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_Graphics_Imaging", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_Media_MediaFoundation", "Win32_UI_WindowsAndMessaging"] }
rfd = "0.15"
rodio = { version = "0.20", features = ["symphonia-aac", "symphonia-isomp4"] }
notify = { version = "8", default-features = false }
raw-window-handle = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.20"
unrar = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"

# decode images fast even in debug builds
[profile.dev.package."*"]
opt-level = 3
